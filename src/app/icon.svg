<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#121a29" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Top Isometric Face Gradient -->
    <linearGradient id="facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Left Isometric Face Gradient -->
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Right Isometric Face Gradient -->
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg-glow)" />
  <rect width="510" height="510" x="1" y="1" rx="99" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Surrounding Network Circuit Grid & Satellite Agents -->
  <g opacity="0.6">
    <circle cx="256" cy="256" r="190" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8, 12" opacity="0.3" />
    <circle cx="256" cy="256" r="215" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4, 16" opacity="0.25" />

    <!-- Isometric Coordinate Guides -->
    <line x1="256" y1="40" x2="256" y2="472" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2, 6" opacity="0.2" />
    <line x1="70" y1="150" x2="442" y2="362" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2, 6" opacity="0.2" />
    <line x1="442" y1="150" x2="70" y2="362" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2, 6" opacity="0.2" />

    <!-- Satellite Agent Micro-Cubes (Autonomous Nodes) -->
    <g transform="translate(256, 75)">
      <polygon points="0,-14 12,-7 0,0 -12,-7" fill="#38bdf8" />
      <polygon points="-12,-7 0,0 0,14 -12,7" fill="#0284c7" />
      <polygon points="0,0 12,-7 12,7 0,14" fill="#00f0ff" />
    </g>
    <g transform="translate(420, 190)">
      <polygon points="0,-12 10,-6 0,0 -10,-6" fill="#c084fc" />
      <polygon points="-10,-6 0,0 0,12 -10,6" fill="#8b5cf6" />
      <polygon points="0,0 10,-6 10,6 0,12" fill="#d8b4fe" />
    </g>
    <g transform="translate(390, 380)">
      <polygon points="0,-10 9,-5 0,0 -9,-5" fill="#38bdf8" />
      <polygon points="-9,-5 0,0 0,10 -9,5" fill="#0284c7" />
      <polygon points="0,0 9,-5 9,5 0,10" fill="#00f0ff" />
    </g>
    <g transform="translate(120, 380)">
      <polygon points="0,-10 9,-5 0,0 -9,-5" fill="#c084fc" />
      <polygon points="-9,-5 0,0 0,10 -9,5" fill="#8b5cf6" />
      <polygon points="0,0 9,-5 9,5 0,10" fill="#d8b4fe" />
    </g>
    <g transform="translate(90, 190)">
      <polygon points="0,-12 10,-6 0,0 -10,-6" fill="#38bdf8" />
      <polygon points="-10,-6 0,0 0,12 -10,6" fill="#0284c7" />
      <polygon points="0,0 10,-6 10,6 0,12" fill="#00f0ff" />
    </g>
  </g>

  <!-- Central Radial Core Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#core-glow)" filter="url(#intense-glow)" />

  <!-- Outer Isometric Fortress Hexagon / Monolith -->
  <g filter="url(#glow)">
    <!-- Top Face -->
    <polygon points="256,110 376,179 256,248 136,179" fill="url(#facet-top)" stroke="#38bdf8" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="136,179 256,248 256,386 136,317" fill="url(#facet-left)" stroke="#0284c7" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="256,248 376,179 376,317 256,386" fill="url(#facet-right)" stroke="#818cf8" stroke-width="2" />

    <!-- Inner Core Cutout Void -->
    <polygon points="256,160 326,200 256,240 186,200" fill="#090d16" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="186,200 256,240 256,320 186,280" fill="#06090e" stroke="#00f0ff" stroke-width="1.5" />
    <polygon points="256,240 326,200 326,280 256,320" fill="#0b0a1a" stroke="#8b5cf6" stroke-width="1.5" />

    <!-- Central Floating Energy Pillar / Heart -->
    <g>
      <polygon points="256,205 286,222 256,239 226,222" fill="#00f0ff" filter="url(#intense-glow)" />
      <polygon points="226,222 256,239 256,273 226,256" fill="#0284c7" />
      <polygon points="256,239 286,222 286,256 256,273" fill="#c084fc" />
    </g>

    <!-- Structural High-Tech Neon Edges and Circuit Grooves -->
    <path d="M 256,110 L 256,160 M 376,179 L 326,200 M 136,179 L 186,200" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
    <path d="M 256,320 L 256,386 M 186,280 L 136,317 M 326,280 L 376,317" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />

    <!-- High-tech Node Dots -->
    <circle cx="256" cy="110" r="4" fill="#ffffff" filter="url(#glow)" />
    <circle cx="376" cy="179" r="4" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="136" cy="179" r="4" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="256" cy="386" r="4" fill="#ffffff" filter="url(#glow)" />
    <circle cx="136" cy="317" r="4" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="376" cy="317" r="4" fill="#8b5cf6" filter="url(#glow)" />
  </g>
</svg>
